<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRL_AI OS · Particle Universe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>✦</text></svg>">
<!--
  MRL_AI OS — 產品級入口 (MRL_Product_Entry_UI)
  origin_signature: MrLiouWord
  對應工程交代：Issue #25 產品級首頁 / #26 大輸入框 / #27 不用工程測試頁或裸JSON /
                #28 內部 MRL_ 命名+外部商業名映射 / #29 新會話・歷史會話・任務狀態
  權位：本頁為對外門面 (Adapter)；母體本體在 DL580 / MotherAssembly。
        接不通後端時，誠實顯示「需母體後端」，不偽造成功。
-->
<style>
:root{
  --bg:#0b0f0d; --panel:#0f1512; --panel2:#121a16; --line:#1d2a22;
  --ink:#e7f0ea; --dim:#8aa294; --acc:#27d07a; --acc2:#1f9d63;
  --danger:#ff6b6b; --warn:#ffcc66; --chip:#15201a; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC",Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--acc)}
.hide{display:none!important}

/* ── Login ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#10241a 0%,var(--bg) 60%);padding:24px;z-index:50}
.lcard{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.brandbig{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#2bd47e,#168a9e);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 24px rgba(43,212,126,.35)}
.lcard h1{margin:2px 0 0;font-size:22px;letter-spacing:.5px}
.lcard .sub{color:var(--dim);font-size:13px}
.field{margin:14px 0}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit}
.btn{width:100%;padding:12px 14px;border:0;border-radius:10px;background:var(--acc);color:#04150c;font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.sso{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.note{font-size:11px;color:var(--dim);text-align:center;margin-top:14px}
.pending{font-size:10px;color:var(--warn);border:1px solid #3a3320;background:#1a1710;border-radius:6px;padding:1px 6px;margin-left:6px}

/* ── App shell ── */
#app{display:grid;grid-template-columns:264px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .logo{width:34px;height:34px;border-radius:10px;font-size:16px}
.brand b{font-size:15px}
.brand small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.newbtn{margin:4px 12px 8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.newbtn:hover{border-color:var(--acc2)}
.navwrap{overflow:auto;flex:1;min-height:0;padding:4px 8px 8px}
.navsec{color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);width:100%;border:0;background:transparent;text-align:left}
.nav .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--chip);flex:none}
.nav:hover{background:var(--panel2)}
.nav.on{background:linear-gradient(90deg,rgba(39,208,122,.16),rgba(39,208,122,.04));color:#fff}
.nav.on .ic{background:var(--acc);color:#04150c}
.nav small{display:block;color:var(--dim);font-size:10px}
.foot{border-top:1px solid var(--line);padding:10px 14px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between;align-items:center}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent)}
.topbar .title{font-weight:700}
.topbar .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(39,208,122,.18)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(255,204,102,.16)}
.spacer{flex:1}
.content{flex:1;overflow:auto;min-height:0}
.view{display:none;height:100%}
.view.on{display:block}

/* Home */
.home{max-width:860px;margin:0 auto;padding:8vh 22px 40px;text-align:center}
.home h2{font-size:30px;margin:0 0 6px}
.home .lead{color:var(--dim);margin-bottom:26px}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.composer textarea{width:100%;border:0;background:transparent;color:var(--ink);font:16px/1.5 inherit;resize:none;outline:none;min-height:76px}
.composer .row{display:flex;align-items:center;gap:8px;margin-top:8px}
.composer select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 9px;font:inherit}
.send{margin-left:auto;background:var(--acc);color:#04150c;border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;gap:10px;align-items:center}
.qcard:hover{border-color:var(--acc2);background:var(--panel2)}
.qcard .ic{width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center}

/* Chat */
.chatwrap{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:22px;max-width:900px;margin:0 auto;width:100%}
.msg{display:flex;gap:12px;margin-bottom:18px}
.msg .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--chip);font-size:14px}
.msg.me .av{background:#21304a}
.msg.ai .av{background:var(--acc);color:#04150c}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;white-space:pre-wrap;word-break:break-word;max-width:100%}
.msg.me .bub{background:var(--panel2)}
.status{font-size:11px;color:var(--dim);margin:2px 0 0}
.status .s{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.s.QUEUED{color:var(--dim)} .s.RUNNING{color:var(--warn);border-color:#3a3320}
.s.DONE{color:var(--acc);border-color:var(--acc2)} .s.FAILED{color:var(--danger);border-color:#4a2222}
.composer.bottom{max-width:900px;margin:0 auto;width:100%;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:transparent;box-shadow:none;padding:14px 22px 18px}

/* Generic tool panel */
.panel{max-width:880px;margin:0 auto;padding:30px 22px}
.panel h2{margin:0 0 4px}
.panel .lead{color:var(--dim);margin-bottom:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:600}
.act.primary{background:var(--acc);color:#04150c;border:0}
pre{background:#070b09;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe9da;margin:10px 0 0}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid #3a3320;background:#15110a;border-radius:10px;padding:10px 12px;color:var(--warn);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.sesslist{padding:4px 8px}
.sess{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:var(--ink);width:100%;border:0;background:transparent;text-align:left;font-size:13px}
.sess:hover{background:var(--panel2)} .sess.on{background:var(--panel2)}
.sess .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .x{opacity:0;color:var(--dim)} .sess:hover .x{opacity:1}
#menuBtn{display:none}
#scrim{display:none}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:300px;z-index:30;transform:translateX(-100%);transition:transform .22s ease}
  aside.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.65)}
  #menuBtn{display:inline-block}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
  .home{padding:6vh 16px 40px}.home h2{font-size:24px}
}
</style>
</head>
<body>

<!-- ───────────── Login (Issue #25 入口 / P1-1 帳號待接後端) ───────────── -->
<div id="login">
  <div class="lcard">
    <div class="brandbig">
      <div class="logo">✦</div>
      <h1>MRL_AI OS</h1>
      <div class="sub">智能作業系統平台 · Particle Universe</div>
    </div>
    <div class="field">
      <label>Email 地址</label>
      <input id="email" type="email" placeholder="your@email.com" autocomplete="email">
    </div>
    <button class="btn" id="magic">發送登入連結<span class="pending">待接後端</span></button>
    <div class="divider">或</div>
    <button class="btn sso ghost" data-sso="Google">使用 Google 登入<span class="pending">待接後端</span></button>
    <button class="btn sso ghost" data-sso="Apple">使用 Apple 登入<span class="pending">待接後端</span></button>
    <div class="divider">先看產品</div>
    <button class="btn" id="guest">以訪客進入 MRL_AI OS</button>
    <div class="note">origin_signature = MrLiouWord ｜ 登入即表示同意服務條款與隱私政策<br>
      SSO / Email 登入需 MRL_Auth 後端 (Issue #11 · P1-1)，目前為前端入口。</div>
  </div>
</div>

<!-- ───────────── App shell ───────────── -->
<div id="app" class="hide">
  <aside id="aside">
    <div class="brand">
      <div class="logo">✦</div>
      <div><b>MRL_AI</b><small>Particle Universe</small></div>
    </div>
    <button class="newbtn" id="newSess">＋ 新會話</button>
    <div class="navwrap">
      <div class="navsec">會話 / Sessions</div>
      <div class="sesslist" id="sesslist"></div>
      <div class="navsec">工具 / Tools</div>
      <div id="navtools"></div>
      <div class="navsec">母體 / Core</div>
      <div id="navcore"></div>
    </div>
    <div class="foot"><span>MrLiouWord</span><span id="footver">v1.7</span></div>
  </aside>

  <main>
    <div class="topbar">
      <button class="act" id="menuBtn" style="padding:6px 12px">☰ 工具</button>
      <span class="dot" id="coreDot"></span>
      <span class="title" id="topTitle">MRL_AI</span>
      <span class="tag">權位區分模式</span>
      <span class="tag" id="engineTag">engine: 偵測中…</span>
      <div class="spacer"></div>
      <span class="tag">canonical: 中文</span>
    </div>
    <div class="content" id="content"></div>
  </main>
  <div id="scrim"></div>
</div>

<script>
const ORIGIN_SIGNATURE="MrLiouWord";
const $=(s,r=document)=>r.querySelector(s);

/* ── Issue #28：內部 MRL_ 命名 → 外部商業顯示名映射 ── */
const TOOLS=[
  {id:"MRL_Dialogue",     name:"AI 對話",        ic:"🤖", sec:"tool", api:"/api/chat", home:true},
  {id:"MRL_VideoGen",     name:"影片生成器",      ic:"🎬", sec:"tool"},
  {id:"MRL_SkillCreator", name:"技能創作者",      ic:"✨", sec:"tool"},
  {id:"MRL_Config",       name:"MRL Config",     ic:"⚙️", sec:"tool"},
  {id:"MRL_ASIReport",    name:"ASI 分析報告",    ic:"🧪", sec:"tool"},
  {id:"MRL_ImageStudio",  name:"圖像工坊",        ic:"🖼️", sec:"tool"},
  {id:"MRL_AudioGen",     name:"生成音頻",        ic:"🎙️", sec:"tool"},
  {id:"MRL_Slides",       name:"製作投影片",      ic:"📊", sec:"tool"},
  {id:"MRL_Sheets",       name:"建立電子表格",    ic:"📗", sec:"tool"},
  {id:"MRL_WideResearch", name:"Wide Research",  ic:"🌐", sec:"tool"},
  {id:"MRL_Scheduler",    name:"排程任務",        ic:"🗓️", sec:"tool"},
  {id:"MRL_Playbook",     name:"Playbook",       ic:"📘", sec:"tool"},
  {id:"MRL_Database",     name:"資料庫",          ic:"🗄️", sec:"tool"},
  {id:"MRL_Monitor",      name:"即時監控",        ic:"📈", sec:"core", api:"/api/monitor"},
  {id:"MRL_Console",      name:"母體控制台",      ic:"🛰️", sec:"core", api:"/api/mother/status"},
  {id:"MRL_QuantumTopology", name:"MRL_QuantumTopology", ic:"🧬", sec:"core"},
  {id:"MRL_SuperComputer",   name:"MRL_SUPERCOMPUTER",   ic:"🖥️", sec:"core"},
  {id:"MRL_Settings",     name:"設定",            ic:"🔧", sec:"core"},
];
const HOME_CARDS=[
  {t:"製作簡報", ic:"📊", tool:"MRL_Slides", prompt:"幫我製作一份簡報："},
  {t:"建立網站", ic:"🌐", tool:"MRL_SkillCreator", prompt:"幫我建立一個網站："},
  {t:"開發應用", ic:"💻", tool:"MRL_SkillCreator", prompt:"幫我開發一個應用："},
  {t:"設計",     ic:"🎨", tool:"MRL_ImageStudio", prompt:"幫我設計："},
  {t:"Wide Research", ic:"🔎", tool:"MRL_WideResearch", prompt:"幫我深入研究："},
];

/* ── 後端探測 ── */
let CORE_ONLINE=false;
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  let data=null; try{data=await r.json()}catch(e){}
  return {ok:r.ok,status:r.status,data};
}
async function probe(){
  try{
    const r=await fetch('/api/mother/status');
    // HTTP 200 但 available:false（母體未 boot）也視為未連線，不誤標「已連線」
    if(r.ok){
      let data=null; try{data=await r.json()}catch(e){}
      CORE_ONLINE=(data&&data.available===false)?false:true;
    }else{ CORE_ONLINE=false }
  }catch(e){ CORE_ONLINE=false }
  $('#coreDot').className='dot'+(CORE_ONLINE?'':' off');
  $('#engineTag').textContent='engine: '+(CORE_ONLINE?'母體後端已連線':'前端模式（待接 DL580/MotherAssembly）');
}

/* ── Sessions (Issue #29) localStorage ── */
const DB={
  load(){ try{return JSON.parse(localStorage.getItem('mrl_sessions')||'[]')}catch(e){return[]} },
  save(s){ localStorage.setItem('mrl_sessions',JSON.stringify(s)) },
};
let sessions=DB.load(), current=null;
function newSession(){
  const s={id:'MRL_'+Date.now().toString(36),label:'新會話',msgs:[],created:Date.now()};
  sessions.unshift(s); DB.save(sessions); current=s.id; renderSessions(); openView('MRL_Dialogue');
  return s;
}
function getCur(){ return sessions.find(s=>s.id===current) }
function renderSessions(){
  const el=$('#sesslist');
  if(!sessions.length){ el.innerHTML='<div style="color:var(--dim);font-size:12px;padding:6px 10px">尚無會話</div>'; return }
  el.innerHTML='';
  sessions.forEach(s=>{
    const b=document.createElement('button'); b.className='sess'+(s.id===current?' on':'');
    b.innerHTML=`<span>💬</span><span class="t">${esc(s.label)}</span><span class="x" title="刪除">✕</span>`;
    b.onclick=(e)=>{ if(e.target.classList.contains('x')){ delSession(s.id); e.stopPropagation(); return } current=s.id; renderSessions(); openView('MRL_Dialogue') };
    el.appendChild(b);
  });
}
function delSession(id){ sessions=sessions.filter(s=>s.id!==id); if(current===id)current=null; DB.save(sessions); renderSessions(); if(!current)openView('MRL_Dialogue') }

/* ── Nav render ── */
function renderNav(){
  const tw=$('#navtools'), cw=$('#navcore'); tw.innerHTML=''; cw.innerHTML='';
  TOOLS.forEach(t=>{
    const b=document.createElement('button'); b.className='nav'; b.dataset.id=t.id;
    b.innerHTML=`<span class="ic">${t.ic}</span><span>${esc(t.name)}<small>${t.id}</small></span>`;
    b.onclick=()=>openView(t.id);
    (t.sec==='core'?cw:tw).appendChild(b);
  });
}
function setActiveNav(id){ document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.id===id)) }

/* ── Views ── */
let activeTool='MRL_Dialogue';
const isMobile=()=>window.matchMedia('(max-width:820px)').matches;
function toggleDrawer(open){
  const aside=$('#aside'); if(!aside)return;
  const o=(open===undefined)?!aside.classList.contains('open'):open;
  aside.classList.toggle('open',o); $('#scrim').classList.toggle('on',o);
}
function openView(id){
  activeTool=id; setActiveNav(id);
  const t=TOOLS.find(x=>x.id===id)||{};
  $('#topTitle').textContent=t.name||'MRL_AI';
  if(isMobile())toggleDrawer(false);
  const c=$('#content');
  if(id==='MRL_Dialogue'){ return getCur()?renderChat():renderHome() }
  if(id==='MRL_Monitor'){ return renderMonitor() }
  if(id==='MRL_Console'){ return renderConsole() }
  if(id==='MRL_Config'||id==='MRL_Settings'){ return renderSettings() }
  return renderToolStub(t);
}
function renderHome(){
  $('#content').innerHTML=`
    <div class="home view on">
      <h2>MRL_AI 能幫你做什麼？</h2>
      <div class="lead">直接輸入你的問題或任務，母體會接手。origin_signature = MrLiouWord</div>
      <div class="composer">
        <textarea id="homeInput" placeholder="問任何問題，或交派一個任務…"></textarea>
        <div class="row">
          <select id="homeMode"><option value="chat">對話 / chat</option><option value="agent">任務 / agent</option></select>
          <button class="send" id="homeSend">送出 ▷</button>
        </div>
      </div>
      <div class="cards" id="qcards"></div>
    </div>`;
  const cards=$('#qcards');
  HOME_CARDS.forEach(c=>{
    const d=document.createElement('button'); d.className='qcard';
    d.innerHTML=`<span class="ic">${c.ic}</span><div><b>${c.t}</b><div style="color:var(--dim);font-size:12px">${c.tool}</div></div>`;
    d.onclick=()=>{ $('#homeInput').value=c.prompt; $('#homeInput').focus() };
    cards.appendChild(d);
  });
  $('#homeSend').onclick=()=>{ const v=$('#homeInput').value.trim(); if(!v)return; const s=getCur()||newSession(); s.label=v.slice(0,24); send(v) };
  $('#homeInput').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#homeSend').click() });
}
function renderChat(){
  const s=getCur(); if(!s)return renderHome();
  $('#content').innerHTML=`
    <div class="chatwrap view on">
      <div class="msgs" id="msgs"></div>
      <div class="composer bottom">
        <textarea id="chatInput" placeholder="繼續對話… (⌘/Ctrl+Enter 送出)" style="min-height:54px"></textarea>
        <div class="row"><span style="color:var(--dim);font-size:12px">${esc(s.id)}</span>
          <button class="send" id="chatSend">送出 ▷</button></div>
      </div>
    </div>`;
  paintMsgs();
  $('#chatSend').onclick=()=>{ const v=$('#chatInput').value.trim(); if(v){$('#chatInput').value='';send(v)} };
  $('#chatInput').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('#chatSend').click() });
}
function paintMsgs(){
  const s=getCur(), m=$('#msgs'); if(!m)return; m.innerHTML='';
  s.msgs.forEach(x=>{
    const d=document.createElement('div'); d.className='msg '+(x.role==='user'?'me':'ai');
    const st=x.status?`<div class="status">任務狀態 <span class="s ${x.status}">${x.status}</span>${x.engine?' · engine: '+esc(x.engine):''}</div>`:'';
    d.innerHTML=`<div class="av">${x.role==='user'?'你':'✦'}</div><div><div class="bub">${esc(x.text)}</div>${st}</div>`;
    m.appendChild(d);
  });
  m.scrollTop=m.scrollHeight;
}
/* ── unwrapReply: dig out a string from any nesting ── */
function unwrapReply(data){
  let d=data; let depth=0;
  while(d&&typeof d==='object'&&depth<8){
    if(typeof d.reply==='string') return d.reply;
    if(typeof d.output==='string') return d.output;
    if(typeof d.text==='string') return d.text;
    if(typeof d.reply==='object') d=d.reply;
    else if(typeof d.output==='object') d=d.output;
    else break;
    depth++;
  }
  return JSON.stringify(data,null,2);
}
async function send(text){
  const s=getCur()||newSession();
  s.msgs.push({role:'user',text});
  const ai={role:'assistant',text:'',status:'QUEUED'}; s.msgs.push(ai);
  DB.save(sessions); if(activeTool!=='MRL_Dialogue')openView('MRL_Dialogue'); else renderChat();
  ai.status='RUNNING'; paintMsgs();
  try{
    const r=await api('POST','/api/chat',{message:text,session_id:s.id});
    if(r.ok && r.data && r.data.ok!==false){
      ai.text = unwrapReply(r.data);
      ai.engine = r.data.engine || r.data.route || r.data.via || (CORE_ONLINE?'母體後端':'平台');
      ai.status='DONE';
    }else if(r.ok && r.data && r.data.ok===false){
      // 後端以 HTTP 200 回 {ok:false,reason}（如母體未 boot、message 缺漏）— 誠實標 FAILED
      ai.status='FAILED';
      const reason=(typeof r.data.reason==='string'&&r.data.reason.trim())?r.data.reason.trim():JSON.stringify(r.data,null,2);
      ai.text='⚠ 母體回報失敗：'+reason;
    }else{
      ai.status='FAILED';
      const reason=(r.data&&(r.data.reason||r.data.error))||('HTTP '+r.status);
      ai.text='⚠ 母體後端尚未連通（'+reason+'）。\n\n'
            +'此回應需要 MRL 母體後端 (MotherAssembly / DL580 runtime)。\n'
            +'本頁為對外產品入口；接上後端後即可真實對話，不偽造結果。\n'
            +'請在 Cloudflare 設 MRL_DL580_ORIGIN，或在本機啟動 MRL_Platform_Server.py。';
    }
  }catch(e){
    ai.status='FAILED';
    ai.text='⚠ 無法連線母體後端。本頁為前端入口（可獨立瀏覽）；\n真實對話需啟動後端：python3 MRL_Platform_Server.py，或部署 DL580。';
  }
  DB.save(sessions); paintMsgs();
}

function needCore(r){ return '⚠ 需母體後端 (HTTP '+r.status+')。\n'+((r.data&&r.data.reason)?('原因：'+r.data.reason):'啟動 MRL_Platform_Server.py 或設定 DL580 origin。') }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
