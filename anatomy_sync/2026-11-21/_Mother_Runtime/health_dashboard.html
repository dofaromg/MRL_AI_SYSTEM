<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⋄ 母體 Health Dashboard · real-time</title>
<!--
  real-time health polling · 承 gap_analysis 第 3 項
  用途: 開著不動 · 每 N 秒自動 polling 關鍵 worker · 顯示呼吸節奏
  direction author: user (2026-11-21 「A B C 依續完成」· B gap_analysis 第 3 項)
  content author: AI (Claude Opus 4.7)
  origin_signature: MrLiouWord
-->
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Microsoft JhengHei",monospace}
body{background:#050810;color:#e8ecf1;padding:12px}
h1{font-size:16px;color:#7cc4ff}
.bar{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:12px}
.bar input{background:#0a0e1a;color:#e8ecf1;border:1px solid #334;padding:4px;border-radius:3px;font-family:monospace}
.bar label{color:#8a95a8}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:#5fd77e;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;margin-top:12px}
.cell{background:#0f1424;border:1px solid #223;border-left:4px solid #334;border-radius:4px;padding:8px;font-size:12px;position:relative}
.cell.ok{border-left-color:#5fd77e}
.cell.warn{border-left-color:#ffc847}
.cell.err{border-left-color:#ff6b7a}
.cell.pending{border-left-color:#5a7ab0;opacity:.7}
.cell .n{font-weight:bold;color:#7cc4ff;font-size:13px}
.cell .s{color:#8a95a8;font-size:10px;margin-top:2px}
.cell .r{color:#5fd77e;font-size:10px}
.cell .r.e{color:#ff6b7a}
.cell .t{position:absolute;top:4px;right:6px;font-size:9px;color:#5a7ab0}
.stats{display:flex;gap:16px;background:#0a0e1a;padding:8px;border-radius:4px;margin:8px 0;font-size:12px}
.stats b{color:#ffc847}
.event-log{background:#030610;border:1px solid #223;padding:8px;border-radius:4px;max-height:160px;overflow:auto;font-size:11px;margin-top:12px}
.event-log .l{padding:2px 0;border-bottom:1px dotted #223}
.event-log .ok{color:#5fd77e}
.event-log .er{color:#ff6b7a}
button{background:#1a2440;color:#e8ecf1;border:1px solid #3a4a70;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:11px;margin-left:4px}
</style>
</head>
<body>

<h1><span class="pulse"></span> 母體 Health Dashboard · real-time polling</h1>
<div style="color:#8a95a8;font-size:11px;margin:4px 0 8px">
  origin_signature: MrLiouWord · 從 bindings_map 10 支 tier1-3 worker 取 · 每 N 秒自動 probe
</div>

<div class="bar">
  <label>CF subdomain</label>
  <input id="cfSub" value="z814241.workers.dev" size="24">
  <label>間隔 (秒)</label>
  <input id="intv" type="number" value="15" min="5" max="300" style="width:60px">
  <button onclick="toggle()">▶ <span id="tgl">開始</span></button>
  <button onclick="probeOnce()">⟳ 立即掃一次</button>
  <button onclick="clearEvents()">✕ 清事件</button>
</div>

<div class="stats">
  <div>uptime <b id="uptime">0s</b></div>
  <div>polls <b id="polls">0</b></div>
  <div>alive <b id="aliveN">—</b></div>
  <div>dead <b id="deadN">—</b></div>
  <div>last error <b id="lastErr">—</b></div>
</div>

<div class="grid" id="grid"></div>

<div style="margin-top:12px;color:#8a95a8;font-size:11px">■ 事件流 (最新 50)</div>
<div class="event-log" id="evLog"></div>

<script>
// ============ 關鍵 10 支 (承 wrangler_deploy.sh 階段 1-3) ============
const WORKERS=[
  {n:'particle-auth-gateway',l:'L0 殼'},
  {n:'mrl-cloud-bridge',l:'L-1 殼'},
  {n:'metaenv-ctrl',l:'L-1 殼'},
  {n:'mrl-kernel',l:'L1 腦'},
  {n:'mrl-particle-collapse-engine',l:'L-1 腦'},
  {n:'mrl-network-layer',l:'L-1 腦'},
  {n:'mrl-sync-engine',l:'L2/3 血'},
  {n:'mrl-observer',l:'L4 血'},
  {n:'mrl-globe',l:'L4 血'},
  {n:'particle-toolbox-router',l:'L∞ 調度'}
];

let running=false;
let timer=null;
let startTs=0;
let polls=0;
const state={}; // worker name → {status, rt, lastSeen}

function cfSub(){return document.getElementById('cfSub').value.trim()||'z814241.workers.dev'}
function wk(n){return`https://${n}.${cfSub()}/health`}

function renderGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  WORKERS.forEach(w=>{
    const s=state[w.n]||{status:'pending'};
    const d=document.createElement('div');
    d.className='cell '+s.status;
    d.innerHTML=`
      <div class="t">${s.ts||''}</div>
      <div class="n">${w.n}</div>
      <div class="s">${w.l}</div>
      <div class="r ${s.status==='err'?'e':''}">${s.rt||'—'} ${s.code?'· '+s.code:''}</div>
    `;
    g.appendChild(d);
  });
}

function evLog(cls,msg){
  const el=document.getElementById('evLog');
  const t=new Date().toISOString().substr(11,8);
  const line=document.createElement('div');
  line.className='l '+cls;
  line.textContent=`[${t}] ${msg}`;
  el.insertBefore(line,el.firstChild);
  while(el.children.length>50)el.removeChild(el.lastChild);
}

function clearEvents(){document.getElementById('evLog').innerHTML=''}

// fix #6 (codex P2 · PR#160) · 加 AbortController timeout · 一個 stalled worker 不再凍結全 polling
const PROBE_TIMEOUT_MS=4000;
async function probeOne(w){
  const t0=performance.now();
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort('timeout'),PROBE_TIMEOUT_MS);
  try{
    const r=await fetch(wk(w.n),{method:'GET',cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    const rt=Math.round(performance.now()-t0);
    const ok=r.ok;
    state[w.n]={status:ok?'ok':'warn',rt:rt+'ms',code:r.status,ts:new Date().toLocaleTimeString().slice(0,8)};
    if(!ok)evLog('er',`${w.n} ${r.status}`);
  }catch(e){
    clearTimeout(timer);
    const rt=Math.round(performance.now()-t0);
    const isTimeout=ctrl.signal.aborted;
    state[w.n]={status:'err',rt:rt+'ms',code:isTimeout?`t/o ${PROBE_TIMEOUT_MS}ms`:'net',ts:new Date().toLocaleTimeString().slice(0,8)};
    evLog('er',`${w.n} ${isTimeout?'timeout('+PROBE_TIMEOUT_MS+'ms)':e.message}`);
    document.getElementById('lastErr').textContent=w.n;
  }
}

async function probeOnce(){
  polls++;
  document.getElementById('polls').textContent=polls;
  await Promise.all(WORKERS.map(probeOne));
  let a=0,d=0;
  WORKERS.forEach(w=>{
    const s=state[w.n];
    if(s&&s.status==='ok')a++;else d++;
  });
  document.getElementById('aliveN').textContent=a;
  document.getElementById('deadN').textContent=d;
  renderGrid();
  evLog('ok',`poll #${polls}: alive ${a} · dead ${d}`);
}

function toggle(){
  running=!running;
  document.getElementById('tgl').textContent=running?'停止':'開始';
  if(running){
    startTs=Date.now();
    probeOnce();
    scheduleNext();
    uptimeTick();
  }else{
    if(timer)clearTimeout(timer);
  }
}

function scheduleNext(){
  const intv=parseInt(document.getElementById('intv').value,10)*1000;
  timer=setTimeout(async()=>{
    if(!running)return;
    await probeOnce();
    scheduleNext();
  },Math.max(5000,intv));
}

function uptimeTick(){
  if(!running)return;
  const s=Math.floor((Date.now()-startTs)/1000);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  document.getElementById('uptime').textContent=`${h}h${m}m${sec}s`;
  setTimeout(uptimeTick,1000);
}

renderGrid();
evLog('ok','就緒 · 按「開始」啟動 polling');
</script>

</body>
</html>
