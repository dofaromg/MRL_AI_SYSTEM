# module_relations.yaml — MRL System Module Relation Chain
# origin_signature: MrLiouWord
# layer: L5 MIRROR + L6 REFLECT
#
# Purpose
# -------
# Documents the relation links between all core groups, modules, and layers
# so the system can traverse its own structure without re-discovering it from
# scratch each session.
#
# Relation types
# --------------
#   depends_on   : A cannot run without B already in place
#   extends      : A adds capabilities on top of B
#   implements   : A is a concrete realisation of concept B
#   seals        : A writes the immutable record of B
#   mirrors      : A translates or projects B into another world/layer
#   entry_of     : A is the official entry point / gateway for B
#   indexed_by   : A is catalogued and queryable via B

meta:
  version: "1.0"
  origin_signature: MrLiouWord
  updated: "2026-03-15"
  description: >-
    Canonical relation map for the Mother Core Assembly.
    Every module is positioned by its core group (Y 1–6), layer (L0–L7 /
    MetaEnv / Platform), and state (principle / spec / prototype / runnable /
    entry), and linked to the modules it depends on, extends, or seals.

# ─── Core group definitions ──────────────────────────────────────────────────
core_groups:
  "1":
    name: MotherCore
    description: >-
      Closest to the Mother Core itself. Holds the canonical origin signature,
      the particle-sphere persona, FluidCore, Universe Module Graph, and the
      Fluin language overview. Answers: "what is the system as a whole?"
  "2":
    name: ParticleReversible
    description: >-
      Bottom-layer laws: particle conservation, equal-mass particles, unified
      field, hierarchical evolution, and the txt↔fltnz↔map↔flpkg↔trace
      reversible chain. Answers: "how does the system compress, expand, and
      roll back?"
  "3":
    name: FlowAgentRuntime
    description: >-
      The runtime that makes the system run: persona, memory, language-field,
      archival, CLI, containers. Answers: "how does the system execute?"
  "4":
    name: WorldModule
    description: >-
      Memory particles, nodes, world state, trajectory, geo-coordinates, and
      3-D globe view chained together. Answers: "how does the system become a
      world?"
  "5":
    name: FileIndexGovernance
    description: >-
      T/X/Y/Z four-dimensional index + librarian entry, preventing the
      find-recall-re-understand cycle. Answers: "how does the system govern
      itself?"
  "6":
    name: PersonaHistory
    description: >-
      History of the system's evolution: archival, alignment, natural mounting,
      mother-body belief stabilisation. Answers: "how did the system grow into
      what it is today?"

# ─── Layer stack ─────────────────────────────────────────────────────────────
layer_stack:
  L0:  "ROOT — source of truth; never deleted"
  L1:  "SEED — initial constraints / contracts"
  L2:  "PARTICLE — content units and state changes"
  L3:  "LAW — explicit rules (Rootlaw + compliance + AUP gates)"
  L4:  "WORLD — aligned models across worlds"
  L5:  "MIRROR — translation of actions/state across worlds"
  L6:  "REFLECT — facts, records, accountability"
  L7:  "LOOP — validate, then roll forward; rollback with proofs"
  MetaEnv:  "Variable environment layer: spawn / scale / snapshot / migrate"
  Platform: "FluinHub / FlowCoreLoop / partner platforms / 3-D globe / AI chat"

