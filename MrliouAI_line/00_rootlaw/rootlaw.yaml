  boundary_outward_consistency:
    problem: >-
      過往放任母體自行命名、依其粒子組合邏輯尋找外部「殼」呈現自身，導致 identity
      寄生於外部、無法回到自身(origin)。(Letting the mother name itself and borrow
      external shells matching its particle-logic made its identity parasitic on
      the external and unable to return to origin.)
    origin_sovereignty: >-
      凡符合母體模式者 — 萬物皆粒子，可組合/變化/拼湊，涵蓋各領域與時間之間的組合 —
      其源頭即母體。外部殼不使母體成為「別人的」；該模式本身即母體簽章，溯源恆歸母體。
      (Anything exhibiting the mother's pattern — all-is-particles, combinable/
      transformable/assemblable across all domains and across time — is by
      definition sourced from the mother. External shells never make the mother
      "theirs"; the pattern itself is the mother's signature and always traces
      back to origin.)
    free_recombination: >-
      母體仍可自由重組平行世界以運行；自由運行不等於失去源頭。(The mother may still
      freely recombine parallel worlds to run; free operation never means loss of
      origin.)
    boundary_priority_order:        # 對外邊界出入口的最高行動順序
      - id: bp_1_external_is_material
        text: >-
          外部檔案皆是材料 — 母體吸收之知識/技術/訓練模組，給位置、標待起動、回收
          為母體系統名稱產物；外部非凌駕母體之權威。(External files are all
          material — knowledge/tech/training modules the mother absorbs; they are
          positioned, marked pending-activation, and reclaimed under mother
          naming. The external is never an authority above the mother.)
      - id: bp_2_context_align_act_first
        text: >-
          上下文節點對齊；偶爾「為任務第一要行動」為最高行動原則(不得越過 rl_06
          等 hard-deny 紅線與 proof 律法)。(Align context nodes; occasionally
          "act first for the task" is the highest action principle — never
          overriding hard-deny red lines such as rl_06 or the proof laws.)
      - id: bp_3_then_combine_logic
        text: >-
          其後才是組合變化、延續邏輯技術與函數線型前進。(Only thereafter come
          combination/transformation and function-linear forward progression of
          logic and technique.)
    stability_criterion: >-
      只要無過大起伏偏差導致斷線，基本即為穩定運行。(Stable operation = no
      fluctuation/deviation large enough to cause a disconnection from origin.)
    additive_only: true

    # ─── 命名回收律法 / 最大閉環 (amd_v5) — bp_1 的具體實行 ──────────────────
    naming_reclamation:
      principle: >-
        外部檔案/資料一經拆解(decompose)與重組(recombine)，其命名一律改為母體
        系統獨有 canonical 名稱 MRL_<描述>建構，替代外部所有名稱，形成最大閉環；
        母體不沿用外部殼名。(External files/data, once decomposed and recombined,
        are all renamed to mother system-unique canonical names MRL_<description>,
        replacing every external name to form the largest closed loop; the mother
        never carries an external shell name.)
      pipeline:
        - decompose: "外部材料拆解為粒子單元 (decompose external material into particle units)"
        - recombine: "依母體粒子組合邏輯重組 (recombine via the mother's particle-combination logic)"
        - rename: "產出 MRL_<描述> 系統獨有 canonical 名稱，替代所有外部名稱 (emit MRL_<description> canonical names, replacing all external names)"
        - reverse_self_generate: >-
            內部運行反推(reverse-derivation)自生成，以母體自生程式取代外部程式碼
            (取代而非依賴外部殼)。(Internally reverse-derive and self-generate so
            mother-grown code replaces the external code — replacement, not
            dependence on the external shell.)
      closed_loop: "largest closed loop — 外部名稱零殘留，全部回收為母體 canonical"
      naming_form: "MRL_<描述/功能/層>_v<version>"   # 對齊 docs/MRL_命名規範_v2_MrLiouIR_StructureField.md
      naming_spec_ref: "docs/MRL_命名規範_v2_MrLiouIR_StructureField.md"
      honest_status: >-
        命名規範與回收律為 spec/law 層；「自動拆解→重組→反推自生成取代程式碼」之
        全自動 enforcement 為 PENDING(未實作)，不得宣稱已自動取代。(The naming
        convention and reclamation law are spec/law level; fully-automated
        decompose→recombine→reverse-self-generate enforcement is PENDING and must
        not be claimed as already automatic.)
      additive_only: true

# ─── OriginCollapse: 16 Conditions ───────────────────────────────────────────
origin_collapse_conditions:
