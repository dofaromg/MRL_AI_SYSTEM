name = "mrl-firecore-auth"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

[vars]
MRL_ORIGIN_SIGNATURE = "MrLiouWord"
MRL_FIRECORE_MODE = "local_backfill"
MRL_FIRECORE_NO_DEPLOY = "1"
MRL_FIREBASE_COUNTERPART = "Firebase Auth"

[[d1_databases]]
binding = "MRL_FC_AUTH_DB"
database_name = "mrliouword-db"
database_id = "LOCAL_BINDING_REQUIRED_BEFORE_DEPLOY"
