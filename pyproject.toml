[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mrliouword"
version = "1.0.0"
description = "Mrliouword — 唯一權威母體系統 (FlowAgent / particle runtime / compliance / trace / memory)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — MR.liou © 2026" }
authors = [{ name = "MR.liou", email = "mrliouword@mrliou.com" }]
keywords = ["mrliouword", "particle", "runtime", "memory", "trace", "flowagent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mrliouword = "mrliouword.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrliouword*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
env = { MRL_RUNTIME_MODE = "test" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
