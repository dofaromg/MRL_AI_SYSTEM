<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRL Universal Runtime Language Core v1.4.0</title><style>body{font-family:system-ui;background:#0d0d0f;color:#eee;margin:0;padding:24px}textarea,input{width:100%;background:#18181b;color:#eee;border:1px solid #444;border-radius:12px;padding:12px;box-sizing:border-box}textarea{height:220px}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 18px;margin:8px 8px 8px 0}.card{background:#18181b;border:1px solid #333;border-radius:16px;padding:18px;margin-top:16px}pre{white-space:pre-wrap;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><h1>MRL_RuntimeOS_EnterpriseRuntimePlatform_CoreExecutable_v1_4_0</h1><p>MRL_UniversalParser → MRL_MetaIR → MRL_ParticleIR → MRL_ContextGraph → MRL_RuntimeGraph → MRL_AttentionKernel → MRL_Execute → MRL_Verify</p><div class="grid"><div><label>MRL_Filename</label><input id="filename" value="MRL_Input.fpp"><textarea id="src">particle CTX { @layer: L2 @data: "整理文件" }
